[package]
name = "winit-bridge"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[dependencies]
wgpu-bridge = { path = "../../wgpu/bridge", version = "=0.1.0" }
winit = { version = "=0.30.12", default-features = false, features = ["rwh_06"] }

[target.'cfg(target_os = "linux")'.dependencies]
winit = { version = "=0.30.12", default-features = false, features = ["x11", "wayland", "wayland-dlopen"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2-foundation = { version = "=0.2.2", default-features = false, features = ["NSThread"] }
